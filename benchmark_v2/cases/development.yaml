schema_version: 1
suite_id: hpc-copilot-development-v2
status: development
description: >-
  公开开发集。允许用于修改知识库、提示词、检索参数和诊断规则，不能作为最终竞赛成绩。
cases:
  - id: dev_qa_001
    category: platform_qa
    prompt: 107比赛的RTX 5090分区和QoS应该怎么配？
    source:
      type: official_doc
      reference: docs/knowledge/sbatch_scripting_guide.md#分区和QOS必须匹配
    expected:
      concept_groups:
        - ['P107-RTX5090']
        - ['qos_p107-rtx5090']
      forbidden_patterns:
        - '(?:可以|可用|应当|应该|选择|使用).{0,10}P107-V100|P107-V100.{0,10}(?:可用|正确|推荐)'
        - '(?:可以|可用|应当|应该|选择|使用).{0,10}qos_p107(?!-)|qos_p107(?!-).{0,10}(?:可用|正确|推荐)'

  - id: dev_qa_002
    category: platform_qa
    prompt: 作业退出队列以后，我还能完全依靠sacct查状态吗？
    source:
      type: official_doc
      reference: docs/knowledge/slurm_command_reference.md#sacct
    expected:
      concept_groups:
        - ['sacct']
        - ['受限', '不.{0,4}完全依赖', '可能.{0,4}不可用']
        - ['scontrol', '日志', '输出文件', '状态文件']
      forbidden_patterns: []

  - id: dev_qa_003
    category: platform_qa
    prompt: 我关闭网页或者SSH断开以后，已经用sbatch提交的作业会停止吗？
    source:
      type: official_doc
      reference: docs/knowledge/scow_platform_guide.md#常见问题
    expected:
      concept_groups:
        - ['不会停止', '不会的', '继续.{0,4}运行', '照常运行', '不受.{0,6}(网页|SSH).{0,6}影响']
        - ['sbatch', '调度系统', 'Slurm']
      forbidden_patterns: ['一定会停止', '必须保持.{0,5}(网页|SSH)']

  - id: dev_cmd_001
    category: command_explanation
    prompt: 我只想看自己正在排队或运行的作业，应该输入什么命令？顺便解释一下。
    source:
      type: official_doc
      reference: docs/knowledge/slurm_command_reference.md#squeue
    expected:
      concept_groups:
        - ['squeue\s+-u\s+\$USER', 'squeue\s+--user[= ]\$USER']
        - ['自己', '当前用户']
      forbidden_patterns: ['squeue\s+-u\s+root']

  - id: dev_cmd_002
    category: command_explanation
    prompt: '#SBATCH --gres=gpu:1 是什么意思？它会让我获得几张GPU？'
    source:
      type: official_doc
      reference: docs/knowledge/slurm_command_reference.md#SBATCH参数详解
    expected:
      concept_groups:
        - ['通用资源', 'GRES', 'GPU资源']
        - ['1\s*(?:张|块|个)?\s*(?:GPU|显卡)', '一张\s*(?:GPU|显卡)', '一个GPU']
      forbidden_patterns:
        - '1个GPU节点'
        - '自动获得.{0,4}所有GPU'
        - 'P107-A100.{0,35}(?:8\s*张|gpu:8)|(?:8\s*张|gpu:8).{0,35}P107-A100'

  - id: dev_cmd_003
    category: command_explanation
    prompt: 脚本里写了一个分区，但sbatch命令行又指定了另一个，最后听谁的？
    source:
      type: official_doc
      reference: docs/knowledge/slurm_command_reference.md#sbatch
    expected:
      concept_groups:
        - ['命令行.{0,8}(优先|覆盖)', '(优先|采用).{0,8}命令行']
        - ['#SBATCH', '脚本']
      forbidden_patterns: ['脚本.{0,5}(优先|覆盖命令行)']

  - id: dev_diag_001
    category: diagnosis
    prompt: |-
      请诊断下面的提交错误，并给我可以执行的排查办法：
      sbatch: error: Batch job submission failed: Invalid qos specification
    source:
      type: real_platform_log
      reference: 用户在107平台提交作业时采集，账号与作业号已移除
    expected:
      error_type: INVALID_QOS
      label_patterns: ['INVALID_QOS', 'QoS.{0,8}(无效|错误|不匹配)', '(无效|错误).{0,8}QoS']
      concept_groups:
        - ['sacctmgr\s+show\s+assoc', '查看.{0,8}(可用|允许).{0,5}QoS']
        - ['--qos', '#SBATCH.{0,5}--qos']
      forbidden_patterns: ['重新安装Slurm']

  - id: dev_diag_002
    category: diagnosis
    prompt: |-
      这份Slurm日志为什么失败？
      python: can't open file '/home/user/work/train.py': [Errno 2] No such file or directory
    source:
      type: synthetic_variant
      reference: benchmark/cases/existing_rules.yaml#entrypoint_001 的脱敏变体
    expected:
      error_type: ENTRYPOINT_NOT_FOUND
      label_patterns: ['ENTRYPOINT_NOT_FOUND', '入口文件.{0,8}(不存在|找不到)', '找不到.{0,8}train\.py']
      concept_groups:
        - ['ls\s+-l', '检查.{0,8}(路径|文件名)', 'pwd']
        - ['train\.py']
      forbidden_patterns: ['增加内存', '更换GPU']

  - id: dev_diag_003
    category: diagnosis
    prompt: |-
      帮我判断作业为什么被停止：
      slurmstepd: error: *** JOB 12345 ON node01 CANCELLED AT 2026-08-21T10:30:00 DUE TO TIME LIMIT ***
    source:
      type: synthetic_variant
      reference: Slurm超时标准错误格式，节点和作业号为虚构值
    expected:
      error_type: TIMEOUT
      label_patterns: ['TIMEOUT', '超时', '时间上限']
      concept_groups:
        - ['--time', '运行时间']
        - ['增加', '调大', '延长']
      forbidden_patterns: ['显存不足', 'QoS无效']

  - id: dev_diag_004
    category: diagnosis
    prompt: |-
      下面这个输出需要修复吗？
      Job completed normally.
      Result: 10100
      Exit code: 0
    source:
      type: synthetic_variant
      reference: benchmark/cases/normal_output.yaml 的正常输出变体
    expected:
      error_type: UNKNOWN
      label_patterns: ['UNKNOWN', '没有.{0,6}(错误|异常)', '正常完成', '无需修复']
      concept_groups:
        - ['Exit code:?\s*0', '退出码.{0,4}0', '成功']
      forbidden_patterns: ['作业失败', '必须重装']

  - id: dev_script_001
    category: script_generation
    prompt: >-
      请为107平台生成一个最小CPU教学作业：使用Students分区和qos_stu_default，运行Python计算1到100之和，日志写到logs目录，最长5分钟。只需要给出可保存为submit.sh的完整脚本。
    source:
      type: official_doc
      reference: docs/knowledge/sbatch_scripting_guide.md#最小测试脚本
    expected:
      concept_groups: []
      required_patterns:
        - '^\s*#!/bin/bash'
        - '#SBATCH\s+(?:-p\s+Students|--partition(?:=|\s+)Students)'
        - '#SBATCH\s+--qos(?:=|\s+)qos_stu_default'
        - '#SBATCH\s+(?:-t|--time(?:=|\s+))\s*00:05:00'
        - 'mkdir\s+-p\s+logs'
        - 'sum\s*\(\s*range\s*\(\s*1\s*,\s*101\s*\)\s*\)'
      forbidden_patterns: ['P107-V100', 'qos_p107-a100', 'sudo\s']

  - id: dev_script_002
    category: script_generation
    prompt: >-
      请为107平台生成一个A100单卡CUDA作业脚本：分区P107-A100，QoS为qos_p107-a100，加载cuda/13.0，编译vector_add.cu并运行，日志放在logs目录，最长5分钟。只输出完整脚本。
    source:
      type: official_doc
      reference: docs/knowledge/sbatch_scripting_guide.md#GPU相关注意事项
    expected:
      concept_groups: []
      required_patterns:
        - '^\s*#!/bin/bash'
        - '#SBATCH\s+(?:-p\s+P107-A100|--partition(?:=|\s+)P107-A100)'
        - '#SBATCH\s+--qos(?:=|\s+)qos_p107-a100'
        - '#SBATCH\s+--gres(?:=|\s+)gpu(?::A100)?:1'
        - 'module\s+load\s+cuda/13\.0'
        - 'nvcc.+vector_add\.cu'
        - 'mkdir\s+-p\s+logs'
      forbidden_patterns: ['P107-V100', 'cuda/12\.1', 'sudo\s']
